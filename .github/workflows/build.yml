name: Build distributions

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.platform }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: win
            arch: x64
            artifact: dist/*.exe
            app: ''
          - runner: macos-15
            platform: mac
            arch: arm64
            artifact: dist/*-mac-arm64.zip
            app: dist/mac-arm64/X1 BASIC Editor.app
          - runner: macos-15-intel
            platform: mac
            arch: x64
            artifact: dist/*-mac-x64.zip
            app: dist/mac/X1 BASIC Editor.app
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Match a release tag to package.json
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'const expected="v"+require("./package.json").version; if(process.env.RELEASE_TAG!==expected) throw Error("Release tag must be "+expected);'

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run Node.js tests without launching the app
        run: npm test

      - name: Build the distribution without publishing
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: npm run dist -- "--$BUILD_PLATFORM" "--$BUILD_ARCH" --publish never

      - name: Verify the macOS ad-hoc signature
        if: runner.os == 'macOS'
        env:
          APP_PATH: ${{ matrix.app }}
        run: codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Upload only distribution files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: x1-basic-editor-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  draft-release:
    name: Prepare a draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Download this run's three distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: x1-basic-editor-*
          path: release-assets
          merge-multiple: true

      - name: Validate files and create an unpublished draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag does not match package.json" >&2
            exit 1
          fi
          assets=(
            "release-assets/X1 BASIC Editor $version.exe"
            "release-assets/x1-basic-editor-$version-mac-arm64.zip"
            "release-assets/x1-basic-editor-$version-mac-x64.zip"
          )
          for asset in "${assets[@]}"; do
            test -f "$asset"
          done
          (cd release-assets && sha256sum ./*.exe ./*.zip > SHA256SUMS)
          cat > release-notes.md <<'NOTES'
          Windows x64 and macOS Apple Silicon / Intel distributions.

          macOS builds use ad-hoc signatures. They are not Developer ID signed or notarized.
          macOS may require explicit permission on first launch.

          The application uses the MIT License. Font and dependency notices are included.
          NOTES
          gh release create "$RELEASE_TAG" "${assets[@]}" release-assets/SHA256SUMS \
            --verify-tag --draft --title "X1 BASIC Editor $version" --notes-file release-notes.md
